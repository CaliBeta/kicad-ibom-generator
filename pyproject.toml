[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-ibom-generator"
version = "1.0.0"
description = "Universal CLI generator for KiCad Interactive HTML BOM with native KiCad 8 & 9+ headless bug fixes."
readme = "README.md"
authors = [
    { name = "CaliBeta", email = "info@calibeta.com" }
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
keywords = [
    "kicad",
    "pcb",
    "pcba",
    "ibom",
    "interactive-bom",
    "eda",
    "hardware",
    "assembly",
    "electronics",
    "kicad8",
    "kicad9",
    "manufacturing",
    "devops",
    "calibeta"
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/calibeta/kicad-ibom-generator"
Repository = "https://github.com/calibeta/kicad-ibom-generator.git"
"Bug Tracker" = "https://github.com/calibeta/kicad-ibom-generator/issues"
"Hardware Services" = "https://calibeta.com"

[project.scripts]
kicad-ibom = "kicad_ibom.cli:main"

[tool.setuptools.packages.find]
include = ["kicad_ibom*"]

